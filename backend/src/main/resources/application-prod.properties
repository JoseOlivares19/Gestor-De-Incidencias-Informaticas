# ==============================================================================
# PERFIL DE PRODUCCIÓN: HEROKU + AIVEN FOR MYSQL 8
# ==============================================================================

spring.application.name=gestorincidencias
server.port=${PORT:8080}

# Conexión JDBC segura hacia Aiven MySQL (inyectada mediante variables de entorno)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Pool de conexiones HikariCP optimizado para Eco Dynos de Heroku y MySQL en la nube
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.pool-name=GestorIncidenciasAivenPool

# Hibernate y JPA
# Compatible con sql_require_primary_key=ON en Aiven
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false

# Configuración de CORS en producción (inyectado con la URL pública de la app frontend en Heroku)
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:4200}

# Seguridad y Token JWT
gestorincidencias.app.jwtSecret=${JWT_SECRET:YTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI=}
gestorincidencias.app.jwtExpirationMs=${JWT_EXPIRATION_MS:86400000}
