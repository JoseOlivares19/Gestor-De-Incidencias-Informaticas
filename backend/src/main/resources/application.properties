spring.application.name=gestorincidencias
spring.jpa.open-in-view=false

# Puerto dinámico con fallback a 8080 para desarrollo local
server.port=${PORT:8080}

# Configuración de base de datos para entorno local
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/gestorincidencias}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:admin}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update

# CORS por defecto para desarrollo local
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:4200}

# JWT con valores seguros por defecto para local
gestorincidencias.app.jwtSecret=${JWT_SECRET:YTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI=}
gestorincidencias.app.jwtExpirationMs=${JWT_EXPIRATION_MS:86400000}
